name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          curl -L -o zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          git clone --depth 1 https://github.com/jmpews/Dobby
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          mkdir -p out/zygisk
          cp module.prop out/
          cp build/libcodm_tex.so out/zygisk/arm64-v8a.so
      - uses: actions/upload-artifact@v4
        with:
          name: codm_tex
          path: out/
